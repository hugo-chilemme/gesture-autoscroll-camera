name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download MediaPipe hand_landmarker model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore release.jks \
            -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=GestureScroll, OU=Dev, O=Ayoub, L=Montreal, C=CA"

          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          IN=app/build/outputs/apk/debug/app-debug.apk
          OUT=gesture-scroll-signed.apk

          $ANDROID_HOME/build-tools/$BT/zipalign -f 4 "$IN" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign \
            --ks release.jks --ks-pass pass:android --key-pass pass:android \
            --out "$OUT" aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gesture-scroll-apk
          path: gesture-scroll-signed.apk
